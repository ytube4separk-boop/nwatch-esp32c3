[env:esp32-c3-supermini]
platform = espressif32@6.10.0
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
build_unflags = -flto
build_flags =
  -fno-lto
  -D CORE_DEBUG_LEVEL=4
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -D CONFIG_BT_NIMBLE_MAX_BONDS=2
  -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED=1
  -D OLED_SDA=0
  -D OLED_SCL=1
  -D OLED_ADDR=0x3C
  -D OLED_CONTROLLER_SH1106=1
  -D BTN_LEFT=10
  -D BTN_SELECT=20
  -D BTN_RIGHT=21
lib_deps =
  h2zero/NimBLE-Arduino@2.4.0
